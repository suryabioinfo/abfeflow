[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abfeflow"
version = "0.2.0"
description = "End-to-end non-equilibrium absolute binding free energy (ABFE) workflow for GROMACS + pmx"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib", "MDAnalysis>=2.4", "PyYAML"]

[project.scripts]
abfeflow = "abfeflow.cli:main"

[tool.setuptools]
packages = ["abfeflow"]
