# AChE full run on a 32-core + single-GPU server (settings from the 100 ps pilot, Oct 2026).
# Pilot: complex dissipation 18/14 kcal/mol at 100 ps -> 1 ns transitions; water 2.4/3.2 -> 500 ps.
project_dir: full
system:
  production_tpr: stateA/md.tpr
  production_xtc: stateA/stateA.xtc      # 3 replicas concatenated, 0-1185 ns
  production_mdp: stateA/md.mdp
  topology: stateA/topol.top
  ligand_moltype: LIG
gromacs:
  gmx: gmx_mpi                           # full path if not on PATH on the new machine
  gpu: true
hardware:
  cores: 32
  pinstride: 1
sampling:
  stateA_window_ns: [0, 1185]
  n_frames_A: 120
  stateB_replicas: 3
  stateB_length_ns: 50
  stateB_discard_ns: 16
  frames_per_replica: 40
  water_eq_ns: 10
  n_frames_water: 100
  transition_ps: {complex: 1000, water: 500}
restraints:
  exclude_residues: ["68-95"]            # Omega loop (AChE numbering = human - 1)
parallel:
  stateB_threads: 9                      # 3 replicas on cores 0-26
  water_eq_threads: 5                    # cores 27-31
  complex_jobs: 4
  complex_threads: 8
  water_jobs: 8
  water_threads: 4
reference:
  dG_exp: null                           # fill in (kcal/mol) if known
  dG_exp_err: null
