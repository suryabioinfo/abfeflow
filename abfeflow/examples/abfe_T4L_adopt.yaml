# Analyse + report the finished T4L L99A/M102Q / 2-propylphenol run without re-running anything.
# Put this file inside ABFE_2PP_3HTB/ and run:  abfeflow adopt && abfeflow analyse && abfeflow report
project_dir: .
system:
  production_tpr: md.tpr
  production_xtc: md.xtc
  production_mdp: 00_inputs/md_production.mdp
  topology: 02_complex/topology/topol_abfe.top
  ligand_moltype: LIG
gromacs: {gmx: /home/user1/SOFT/GRO/2026-3/bin/gmx_mpi}
sampling:                       # must describe how the run was actually done
  stateA_window_ns: [200, 500]
  n_frames_A: 100
  stateB_replicas: 3
  stateB_length_ns: 50
  transition_ps: {complex: 500, water: 200}
  water_eq_ns: 10
analysis: {nboots: 200, stateA_blocks: 3}
reference:
  dG_exp: -5.33
  dG_exp_err: 0.05
  label_exp: "Experiment (Boyce et al. 2009)"
  other: {LIE: -7.62}
  dG_hyd_ref: null              # set after the o-cresol control if you want an automatic check
